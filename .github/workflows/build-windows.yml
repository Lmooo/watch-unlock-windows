name: build-patched-installer

on:
  workflow_dispatch:
  push:
    branches: [ msa-fix ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Toolchain versions
        run: |
          rustup update stable
          rustc --version
          cargo --version
          node --version
          npm --version

      - name: Frontend dependencies
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Frontend build
        working-directory: apps/desktop
        run: npm run build

      - name: Backend tests and release build
        working-directory: backend
        shell: pwsh
        run: |
          function Show-Diagnostics($path) {
            if (Test-Path $path) {
              Get-Content $path | Where-Object { $_ -match 'error(\[|:)|FAILED|panicked at' } |
                Select-Object -First 10 | ForEach-Object { Write-Output ("::error::" + $_) }
              Get-Content $path -Tail 60 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
          }
          $log = Join-Path $env:RUNNER_TEMP 'backend-build.log'
          cargo build --locked -p watch-unlock-provider --message-format=short *>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { Show-Diagnostics $log; exit 1 }
          cargo test --locked --workspace --lib *>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { Show-Diagnostics $log; exit 1 }
          cargo build --locked --workspace --release --message-format=short *>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { Show-Diagnostics $log; exit 1 }

      - name: Desktop tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

      - name: NSIS installer
        working-directory: apps/desktop
        run: npm run tauri -- build --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: watch-unlock-patched
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
